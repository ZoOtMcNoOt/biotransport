[build-system]
requires = [
    "setuptools>=77",
    "wheel>=0.43",
    "cmake>=3.25",
    "ninja>=1.11",
    "pybind11==2.13.6",
    "cmeel-eigen>=3.4,<3.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "biotransport"
version = "0.1.0"
description = "High-performance numerical models for biotransport phenomena"
readme = "readme.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Grant McNatt", email = "gmcnatt1@tamu.edu" },
]
keywords = [
    "biotransport",
    "computational-science",
    "diffusion",
    "fluid-dynamics",
    "mass-transfer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "ruff>=0.8,<1",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ZoOtMcNoOt/biotransport"
Repository = "https://github.com/ZoOtMcNoOt/biotransport"
Issues = "https://github.com/ZoOtMcNoOt/biotransport/issues"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = ["biotransport*"]

[tool.setuptools.package-data]
"biotransport" = ["py.typed"]
"biotransport._core" = ["*.pyi"]
